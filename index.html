<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- 이 사이트가 연결하는 곳:
       자기 자신(학부모용 암호문 p/), GitHub API(관리자 저장), raw.githubusercontent.com(공개 사진 저장소의 암호문),
       YouTube(영상 틀·미리보기 그림), Google 로그인·포토·Drive(관리자가 사진 원본을 보관할 때만, 그때 불러옴).
       글꼴·스크립트·그림은 모두 이 사이트 안에 있다. PDF 는 이 기기에서 푼 blob: 주소로 연다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' blob: data: https://i.ytimg.com; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://photoslibrary.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src blob: https://www.youtube-nocookie.com https://accounts.google.com; object-src blob:; worker-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#4f5bd5">
  <title>자양교회 어린이 합창단</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="js/core/access-ui.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/"><img src="assets/icon.svg" alt=""><span>자양교회 <b>어린이 합창단</b></span></a>
      <nav id="nav" class="nav" aria-label="메뉴"></nav>
      <div id="top-right" class="top-right"></div>
    </header>
    <main id="view" class="view" tabindex="-1"><p class="muted">여는 중…</p></main>
    <nav id="tabbar" class="tabbar" aria-label="메뉴" hidden></nav>
  </div>
  <div id="uploads" class="uploads" hidden></div>
  <dialog id="modal" class="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="noscript">이 사이트는 자바스크립트가 켜져 있어야 보여요.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
